<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Speech Therapy Game</title>

  <link rel="stylesheet" href="../../core/styles.css">

  <style>
    #choose-screen {
      position: fixed; inset: 0; z-index: 100;
      background: linear-gradient(180deg, #87CEEB 0%, #98D8C8 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 1.5rem; overflow-y: auto;
    }
    #choose-screen.hidden { display: none; }
    #choose-screen h2 { font-size: 1.35rem; color: #333; margin-bottom: 0.5rem; text-align: center; }
    #choose-screen p { color: #555; margin-bottom: 1rem; text-align: center; }
    .word-set-list { display: flex; flex-direction: column; gap: 0.75rem; max-width: 520px; width: 100%; margin: 0 auto; }
    .choice-index-options { display: flex; flex-direction: column; gap: 0.75rem; max-width: 520px; width: 100%; margin: 0 auto; }
    .choice-index-options .index-btn {
      background: #fff; border: 3px solid var(--secondary-color, #FF9800);
      border-radius: 12px; padding: 1rem 1.25rem; font-size: 1rem; color: #333;
      text-align: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .choice-index-options .index-btn.secondary { border-color: #888; color: #555; }
    .phoneme-filters { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: center; margin-bottom: 1rem; }
    .phoneme-filters select { padding: 0.5rem 0.75rem; border-radius: 8px; border: 2px solid #FF9800; background: #fff; font-size: 1rem; }
    .phoneme-filters .show-sets-btn { padding: 0.5rem 1rem; background: #FF9800; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .back-row { margin-bottom: 0.75rem; }
    .back-row button { background: transparent; border: 1px solid #666; color: #555; padding: 0.4rem 0.75rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .word-set-btn {
      background: #fff; border: 3px solid var(--secondary-color, #FF9800);
      border-radius: 12px; padding: 1rem 1.25rem; font-size: 1rem; color: #333;
      text-align: left; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="choose-screen" class="hidden">
      <h2 id="choose-title">Choose a word list</h2>
      <p>Pick minimal pairs, single words, or browse all sets from your master list.</p>
      <div id="choice-index-root"></div>
      <div id="word-set-list" class="word-set-list" style="display: none;"></div>
    </div>

    <section class="map-section fullscreen">
      <div id="game-map"></div>
    </section>

    <div id="challenge-modal" class="modal challenge-modal hidden">
      <div class="modal-content challenge-content">
        <h2 id="challenge-prompt">Choose the correct word:</h2>
        <div id="word-pairs" class="pair-container"></div>
      </div>
    </div>

    <div id="victory-modal" class="modal victory-modal hidden">
      <div class="modal-content">
        <h1>Victory!</h1>
        <div id="victory-gif-container">
          <img id="victory-gif" src="" alt="Celebration!" />
        </div>
        <p id="victory-message"></p>
        <button id="play-again">Play Again</button>
      </div>
    </div>
  </div>

  <script src="../../core/word-images.js"></script>
  <script src="../../core/word-challenges.js"></script>
  <script src="../../core/word-set-menus.js"></script>
  <script src="../../core/word-set-choose.js"></script>
  <script src="../../core/discrimination-round.js"></script>
  <script src="../../core/map-game-word-sets.js"></script>
  <script src="../../core/engine.js"></script>
  <script src="../../core/ui.js"></script>
  <script src="../../core/animator.js"></script>
  <script src="../../core/audio.js"></script>

  <script>
    const engine = new GameEngine('./config.json');
    const ui = new GameUI(document.getElementById('game-container'));
    const animator = new PathAnimator(ui);
    const audio = new AudioManager();
    let isProcessing = false;

    const mapWordSets = MapGameWordSets.wire({
      getEngine: () => engine,
      onStartGame: () => renderGame(),
      hintColor: '#555'
    });

    async function initGame() {
      try {
        await engine.loadConfig();
        document.title = engine.config.title || 'Speech Therapy Game';
        const titleEl = document.getElementById('choose-title');
        if (titleEl) titleEl.textContent = engine.config.title || 'Choose a word list';
        await mapWordSets.loadCentralLists();
        mapWordSets.initChooseUI();
        ui.init();
        if (engine.config.victory && engine.config.victory.music) {
          audio.init(engine.config.victory.music);
        }
        setupEventHandlers();
        document.addEventListener('click', () => audio.unlockAudio(), { once: true });
        mapWordSets.tryShowChooseOrStart(() => renderGame());
      } catch (error) {
        console.error('Failed to initialize game:', error);
        alert('Failed to load game. Please check the console for details.');
      }
    }

    async function renderGame(showChallengeDelay = 1500) {
      const challenge = engine.getCurrentChallenge();
      if (challenge) {
        const totalChallenges = engine.config.challenges.length;
        const mapConfig = {
          ...(engine.config.map || {}),
          protagonist: engine.config.protagonist
        };
        ui.renderMap(totalChallenges, engine.currentPosition, mapConfig);
        animator.init();
        await new Promise(resolve => setTimeout(resolve, showChallengeDelay));
        ui.renderChallenge(challenge, engine.config);
      } else if (engine.isVictory()) {
        handleVictory();
      }
    }

    function setupEventHandlers() {
      ui.onAnswer(async (choiceIndex) => {
        if (isProcessing) return;
        isProcessing = true;
        const result = await engine.submitAnswer(choiceIndex);
        ui.showFeedback(result.correct);
        await new Promise(resolve => setTimeout(resolve, 800));
        ui.hideChallengeModal();
        await new Promise(resolve => setTimeout(resolve, 400));
        if (result.correct && engine.currentPosition > 0) {
          animator.playForwardFeedback();
        } else if (!result.correct) {
          animator.playBackwardFeedback();
        }
        await animator.moveToPosition(result.newPosition, 800);
        await new Promise(resolve => setTimeout(resolve, 800));
        if (engine.isVictory()) {
          await handleVictory();
        } else {
          await renderGame(1000);
        }
        isProcessing = false;
      });

      ui.onPlayAgain(() => {
        engine.reset();
        ui.hideVictory();
        mapWordSets.tryShowChooseOrStart(() => renderGame());
      });
    }

    async function handleVictory() {
      await animator.celebrate();
      await ui.showVictory(engine.config);
      await audio.playVictory();
    }

    initGame();
  </script>
</body>
</html>
